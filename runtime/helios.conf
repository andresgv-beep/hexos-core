# HELIOS Runtime Configuration
# This file configures the runtime environment for HELIOS

[paths]
memory_dir = ./runtime/memory
hnf_dir = ./runtime/hnf
lora_dir = ./runtime/lora
logs_dir = ./runtime/logs

[security]
# Default credentials for Advanced Memory menu
# CHANGE THESE IN PRODUCTION!
admin_user = helios
admin_pass_hash = 5e884898da28047d9167e44c5e8f8e2f2b2c7a7a6c7b8d9e0f1a2b3c4d5e6f70
# This is SHA-256 of "helios123" - change in production!

[modules]
# Set to 'real' or 'stub' for each module
hexos_mode = real
memory_core_mode = real
hnf_ext_mode = real
hera_mode = real
cognitive_kernel_mode = stub
cuda_engine_mode = stub

[limits]
max_memory_files = 1000
max_hnf_size_mb = 5
max_lora_adapters = 10
