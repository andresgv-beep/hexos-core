# La puerta de Helios: nginx delante de la interfaz, que solo deja pasar con sesión.
# Quién tiene sesión lo decide hexos/puerta.py (auth_request). nginx corre sin root, con
# prefijo ~/.local/state/hexos/puerta/ (hexos-puerta-nginx.service): las rutas relativas
# cuelgan de ahí. Escucha solo en 127.0.0.1: desde fuera se llega por Tailscale.
worker_processes 1;
pid nginx.pid;
error_log logs/error.log warn;

events { worker_connections 1024; }

http {
    access_log logs/access.log;
    client_body_temp_path tmp/body;
    proxy_temp_path tmp/proxy;
    fastcgi_temp_path tmp/fastcgi;
    uwsgi_temp_path tmp/uwsgi;
    scgi_temp_path tmp/scgi;
    server_tokens off;
    default_type application/octet-stream;

    map $http_upgrade $conexion { default upgrade; '' close; }
    # Freno a probar contraseñas: lo que llega por Tailscale viene todo de 127.0.0.1, así
    # que es un tope común. Solo cuentan los envíos del formulario.
    map $request_method $envio_entrar { POST puerta; default ""; }
    limit_req_zone $envio_entrar zone=entrar:1m rate=20r/m;

    server {
        listen 127.0.0.1:8095;
        server_name puerta;
        client_max_body_size 64m;

        location = /_puerta/comprobar {
            internal;
            proxy_pass http://127.0.0.1:8096;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location = /_puerta/entrar {
            limit_req zone=entrar burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:8096;
            proxy_set_header Host $http_host;
        }

        location /_puerta/ {
            proxy_pass http://127.0.0.1:8096;
            proxy_set_header Host $http_host;
        }

        # Sin sesión: la puerta decide entre la página de entrar y un 401 para la API.
        location @sin_sesion {
            rewrite ^ /_puerta/sin-sesion break;
            proxy_pass http://127.0.0.1:8096;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Original-URI $request_uri;
        }

        location / {
            auth_request /_puerta/comprobar;
            auth_request_set $usuario $upstream_http_x_puerta_usuario;
            error_page 401 = @sin_sesion;

            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $conexion;
            # Quién ha entrado, para lo que venga (invitados). Lo pone nginx: el del cliente se pisa.
            proxy_set_header X-Helios-Usuario $usuario;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
