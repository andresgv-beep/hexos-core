<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HÉCTOR</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --raised: #1c2333;
    --border: #30363d;
    --text: #e6edf3;
    --dim: #8b949e;
    --accent: #58a6ff;
    --user: #234;
    --ok: #3fb950;
    --warn: #f0883e;
    --bad: #f85149;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    background: var(--panel); flex-shrink: 0;
  }
  .brand { font-weight: 700; letter-spacing: 2px; font-size: 14px; }
  .brand span { color: var(--accent); }
  .pill {
    margin-left: auto; display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--dim);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px;
  }
  /* Medidor de contexto: el 4B se degrada bastante antes de llenarlo — se
     pone en ámbar a mitad para avisar antes de que empiece a desvariar. */
  .ctx {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--dim); font-family: ui-monospace, monospace;
  }
  .ctx .bar {
    width: 72px; height: 5px; border-radius: 3px; background: var(--border);
    overflow: hidden;
  }
  .ctx .fill {
    height: 100%; width: 0; background: var(--ok);
    transition: width .4s ease, background .4s ease;
  }
  .ctx.warn .fill { background: var(--warn); }
  .ctx.hot  .fill { background: var(--bad); }
  .ctx.warn, .ctx.hot { color: var(--text); }
  @media (max-width: 560px) { .ctx .bar { width: 44px; } }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .dot.idle { background: var(--ok); }
  .dot.thinking, .dot.speaking { background: var(--accent); animation: pulse 1.2s infinite; }
  .dot.booting { background: var(--warn); animation: pulse 1.2s infinite; }
  .dot.dead { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .3; } }

  main {
    flex: 1; overflow-y: auto; padding: 24px 18px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .wrap { width: 100%; max-width: 780px; margin: 0 auto; }

  .msg { display: flex; flex-direction: column; gap: 6px; }
  .who { font-size: 11px; color: var(--dim); letter-spacing: .5px; }
  .body {
    font-size: 15px; line-height: 1.7; white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.user .body {
    background: var(--raised); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; white-space: pre-wrap;
  }
  .body pre {
    background: #0b0f16; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; overflow-x: auto; margin: 10px 0;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px;
    line-height: 1.55; white-space: pre;
  }
  .body code {
    background: #0b0f16; border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 5px; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
  }
  .body pre code { background: none; border: 0; padding: 0; font-size: inherit; }
  .body strong { color: #fff; }

  .caret {
    display: inline-block; width: 7px; height: 1em; background: var(--accent);
    vertical-align: text-bottom; animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .mudo {
    color: var(--dim); font-style: italic; font-size: 14px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .mudo button {
    font-style: normal; border: 1px solid var(--border); background: var(--raised);
    color: var(--text); border-radius: 6px; padding: 3px 10px; font-size: 12px;
    cursor: pointer; font-family: inherit;
  }
  .mudo button:hover { border-color: var(--accent); }

  .stats {
    font-size: 11px; color: var(--dim); font-family: ui-monospace, Menlo, monospace;
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px;
  }
  .stats span {
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px;
  }

  .thinking {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--dim); font-size: 13px; font-style: italic;
  }
  .thinking b { width: 4px; height: 4px; border-radius: 50%; background: var(--dim);
                animation: bob .9s infinite; }
  .thinking b:nth-child(3) { animation-delay: .15s; }
  .thinking b:nth-child(4) { animation-delay: .3s; }
  @keyframes bob { 50% { transform: translateY(-4px); opacity: .4; } }

  footer {
    border-top: 1px solid var(--border); background: var(--panel);
    padding: 12px 18px; flex-shrink: 0;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
  }
  .composer {
    display: flex; gap: 10px; align-items: flex-end;
    width: 100%; max-width: 780px; margin: 0 auto;
  }
  textarea {
    flex: 1; resize: none; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 14px; font-size: 15px; font-family: inherit;
    line-height: 1.5; max-height: 180px; min-height: 44px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .btn {
    border: 1px solid var(--border); background: var(--raised); color: var(--text);
    border-radius: 10px; height: 44px; padding: 0 14px; cursor: pointer;
    font-size: 14px; font-family: inherit; flex-shrink: 0;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn.send { background: var(--accent); color: #0d1117; font-weight: 600; border-color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .hint { color: var(--dim); font-size: 11px; text-align: center; margin-top: 8px; }
  #file { display: none; }
</style>
</head>
<body>

<header>
  <div class="brand">HÉ<span>CTOR</span></div>
  <div class="ctx" id="ctx" style="margin-left:auto" title="Uso del contexto. El 4B empieza a desvariar bastante antes de llenarlo.">
    <span class="bar"><span class="fill" id="ctxFill"></span></span>
    <span id="ctxText">—</span>
  </div>
  <div class="pill" style="margin-left:12px"><span class="dot booting" id="dot"></span><span id="stateName">conectando</span></div>
</header>

<main id="main"><div class="wrap" id="log"></div></main>

<footer>
  <div class="composer">
    <button class="btn" id="attach" title="Adjuntar un archivo de texto">📎</button>
    <textarea id="input" rows="1" placeholder="Escribe a Héctor…"></textarea>
    <button class="btn send" id="send">Enviar</button>
  </div>
  <div class="hint">Enter envía · Shift+Enter salta de línea</div>
  <input type="file" id="file" accept=".txt,.md,.c,.h,.cpp,.py,.js,.ts,.rs,.json,.log,.csv,.html,.css,.sh,.toml,.yaml,.yml">
</footer>

<script>
'use strict';

const log       = document.getElementById('log');
const main      = document.getElementById('main');
const input     = document.getElementById('input');
const sendBtn   = document.getElementById('send');
const attachBtn = document.getElementById('attach');
const fileInput = document.getElementById('file');
const dot       = document.getElementById('dot');
const stateName = document.getElementById('stateName');

let state    = 'booting';
let current  = null;   // {bodyEl, text} del mensaje que se está recibiendo
let queue    = '';     // caracteres pendientes de dibujar
let carry    = 0;      // fracción de carácter arrastrada entre frames
let thinking = false;
let rawTail  = '';     // resto sin clasificar del flujo crudo
let stats    = null;   // telemetría del turno, si ya empezó a llegar
let lastUserMessage = null;   // para reintentar si el turno sale mudo

const THINK_OPEN = '(pensando';
// helios_chat cierra cada turno con su línea de telemetría. En el terminal
// va dentro del texto; aquí es un dato y se muestra como tal.
const STATS_RE = /\n\[\d+ tok/;

/* ---------------------------------------------------------------------
 * Estado
 * ------------------------------------------------------------------- */
const LABELS = {
  booting: 'cargando modelo', idle: 'listo', thinking: 'pensando',
  speaking: 'escribiendo', dead: 'motor caído'
};

function setState(s) {
  state = s;
  dot.className = 'dot ' + s;
  stateName.textContent = LABELS[s] || s;
  const busy = (s !== 'idle');
  sendBtn.disabled = busy;
  input.disabled = (s === 'dead');
  if (s !== 'thinking' && s !== 'speaking') showThinking(false);
}

/* ---------------------------------------------------------------------
 * Mensajes
 * ------------------------------------------------------------------- */
function addMessage(who, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  const label = document.createElement('div');
  label.className = 'who';
  label.textContent = who === 'user' ? 'TÚ' : 'HÉCTOR';
  const body = document.createElement('div');
  body.className = 'body';
  body.textContent = text || '';
  el.appendChild(label);
  el.appendChild(body);
  log.appendChild(el);
  scroll();
  return body;
}

function scroll() {
  // Solo seguimos al fondo si el usuario ya estaba abajo: si ha subido a
  // releer, no se le arrastra.
  const near = main.scrollHeight - main.scrollTop - main.clientHeight < 120;
  if (near) main.scrollTop = main.scrollHeight;
}

/* El REPL informa del contexto en cada turno ("ctx 1922/4096"). Con Qwen3-4B
 * la calidad se cae mucho antes de llenarlo: pasada la mitad empieza a mezclar
 * idiomas y a repetirse, y como el error entra en el propio contexto, se
 * realimenta. Mejor avisar antes que explicarlo después. */
function updateContext(statsLine) {
  const m = statsLine.match(/ctx\s+(\d+)\s*\/\s*(\d+)/);
  if (!m) return;
  const used = +m[1], total = +m[2];
  const pct = Math.min(100, Math.round(used * 100 / total));
  const box = document.getElementById('ctx');
  document.getElementById('ctxFill').style.width = pct + '%';
  document.getElementById('ctxText').textContent = pct + '%';
  box.className = 'ctx' + (pct >= 70 ? ' hot' : pct >= 45 ? ' warn' : '');
  box.title = used + ' de ' + total + ' posiciones. ' +
    (pct >= 70 ? 'Zona mala: Héctor va a empezar a repetirse y a mezclar idiomas.'
     : pct >= 45 ? 'Ojo: a partir de aquí la calidad cae.'
     : 'Contexto holgado.');
}

let thinkEl = null;
function showThinking(on) {
  if (on && !thinkEl) {
    thinkEl = document.createElement('div');
    thinkEl.className = 'thinking';
    thinkEl.innerHTML = '<span>pensando</span><b></b><b></b><b></b>';
    log.appendChild(thinkEl);
    scroll();
  } else if (!on && thinkEl) {
    thinkEl.remove();
    thinkEl = null;
  }
}

/* ---------------------------------------------------------------------
 * Flujo crudo -> texto visible
 *
 * El motor no imprime el pensamiento: solo "(pensando", un punto cada 40
 * tokens y ")" al cerrar. Eso se convierte en el indicador y no entra al
 * texto. Se retienen unos caracteres por si el marcador viene partido.
 * ------------------------------------------------------------------- */
function ingest(raw) {
  if (stats !== null) { stats += raw; return; }   // el turno ya terminó de hablar
  rawTail += raw;

  for (;;) {
    if (thinking) {
      const close = rawTail.indexOf(')');
      if (close < 0) { rawTail = ''; return; }   // puntitos: se tiran
      rawTail = rawTail.slice(close + 1);
      thinking = false;
      showThinking(false);
      continue;
    }

    // Manda el marcador que aparezca antes. Si se mirase la telemetría
    // primero, un turno que llegara entero en un solo trozo metería
    // "(pensando)" dentro del texto.
    const open = rawTail.indexOf(THINK_OPEN);
    const s    = rawTail.match(STATS_RE);
    const sIdx = s ? s.index : -1;

    if (open >= 0 && (sIdx < 0 || open < sIdx)) {
      emit(rawTail.slice(0, open));
      rawTail = rawTail.slice(open + THINK_OPEN.length);
      thinking = true;
      showThinking(true);
      continue;
    }
    if (sIdx >= 0) {
      emit(rawTail.slice(0, sIdx));
      stats = rawTail.slice(sIdx);
      rawTail = '';
      return;
    }

    // Sin marcador: emite todo menos una cola por si está a medias.
    const hold = THINK_OPEN.length - 1;
    if (rawTail.length > hold) {
      emit(rawTail.slice(0, rawTail.length - hold));
      rawTail = rawTail.slice(rawTail.length - hold);
    }
    return;
  }
}

function emit(text) {
  if (!text) return;
  if (!current) current = { bodyEl: addMessage('helios', ''), text: '' };
  queue += text;
}

/* ---------------------------------------------------------------------
 * EL SUAVIZADO
 *
 * Los tokens llegan a trompicones (uno cada ~66 ms a 15 tok/s) y en trozos
 * de 1 a 8 caracteres: pintarlos según llegan es lo que hace que parezca
 * que va con lag. Aquí se vacía la cola a ritmo proporcional a lo pendiente
 * — acelera si se acumula, frena si queda poco — así que salen caracteres
 * sueltos a 60 fps y se lee como alguien escribiendo.
 * ------------------------------------------------------------------- */
let lastFrame = performance.now();

function frame(now) {
  const dt = Math.min(now - lastFrame, 100);
  lastFrame = now;

  if (queue.length && current) {
    const perMs = Math.max(queue.length / 130, 0.004);
    const want  = perMs * dt + carry;
    let   n     = Math.floor(want);
    carry = want - n;
    // Un emoji son dos unidades: cortar entre ellas pintaría un � suelto
    // durante un frame.
    if (n > 0 && n < queue.length) {
      const c = queue.charCodeAt(n - 1);
      if (c >= 0xD800 && c <= 0xDBFF) n++;
    }
    if (n > 0) {
      current.text += queue.slice(0, n);
      queue = queue.slice(n);
      current.bodyEl.textContent = current.text;
      current.bodyEl.appendChild(caret());
      scroll();
    }
  } else if (!queue.length && current && current.done) {
    finish();
  }
  requestAnimationFrame(frame);
}

function caret() {
  const c = document.createElement('span');
  c.className = 'caret';
  return c;
}

function finish() {
  const el = current.bodyEl;
  // La rienda del motor inyecta el cierre de pensamiento en el KV cuando se
  // agota el techo; a veces el modelo lo reemite luego como texto normal y
  // acaba en la respuesta. Es ruido de control, no algo que Héctor diga.
  const text = current.text.trim().replace(/^<\/think>\s*/, '');

  if (text) {
    el.innerHTML = markdown(text);
  } else {
    // Turno mudo: la rienda cortó el pensamiento y el modelo cerró sin decir
    // nada. Una burbuja en blanco parece un fallo de la web, así que se dice
    // lo que pasó y se ofrece repetir.
    el.className = 'body mudo';
    el.textContent = 'Se quedó callado: le cortaron el pensamiento antes de empezar a responder.';
    if (lastUserMessage) {
      const again = document.createElement('button');
      again.textContent = 'Reintentar';
      const msg = lastUserMessage;
      again.addEventListener('click', () => { again.disabled = true; send(msg); });
      el.appendChild(again);
    }
  }

  if (stats) renderStats(el.parentElement, stats);
  current = null;
  stats = null;
  carry = 0;
  scroll();
}

function renderStats(container, line) {
  const inner = line.replace(/^\s*\[/, '').replace(/\]\s*$/, '').trim();
  if (!inner) return;
  updateContext(inner);
  const box = document.createElement('div');
  box.className = 'stats';
  for (const part of inner.split('·')) {
    const chip = document.createElement('span');
    chip.textContent = part.trim();
    if (chip.textContent) box.appendChild(chip);
  }
  container.appendChild(box);
}

/* ---------------------------------------------------------------------
 * Markdown ligero, solo al cerrar el mensaje
 *
 * Durante el streaming se usa textContent (rápido y sin sustos con la
 * sintaxis a medias); el formato se aplica una vez, al final.
 * ------------------------------------------------------------------- */
function markdown(src) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const blocks = [];
  let out = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    blocks.push('<pre><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>');
    return '␀' + (blocks.length - 1) + '␀';
  });
  out = esc(out)
    .replace(/`([^`\n]+)`/g, (_, c) => '<code>' + c + '</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return out.replace(/␀(\d+)␀/g, (_, i) => blocks[+i]);
}

/* ---------------------------------------------------------------------
 * Transporte
 * ------------------------------------------------------------------- */
function connect() {
  const es = new EventSource('/api/events');

  es.addEventListener('token', e => {
    try { ingest(JSON.parse(e.data).t); } catch (_) {}
  });
  es.addEventListener('start', () => {
    setState('speaking');
    stats = null; rawTail = ''; thinking = false;
  });
  es.addEventListener('thinking', () => { setState('thinking'); showThinking(true); });
  es.addEventListener('end', () => {
    setState('idle');
    if (rawTail) { emit(rawTail); rawTail = ''; }
    // Un turno puede acabar sin haber emitido ni un espacio; aun así hay que
    // decirle al usuario qué pasó en vez de dejarlo sin respuesta.
    if (!current && stats !== null) {
      current = { bodyEl: addMessage('helios', ''), text: '' };
    }
    if (current) current.done = true; else showThinking(false);
  });
  es.addEventListener('ready', () => setState('idle'));
  es.addEventListener('dead',  () => setState('dead'));
  es.addEventListener('state', e => {
    try { setState(JSON.parse(e.data).state); } catch (_) {}
  });

  es.onerror = () => { if (state !== 'dead') setState('booting'); };
}

async function send(text) {
  if (!text.trim() || state !== 'idle') return;
  lastUserMessage = text;
  addMessage('user', text);
  input.value = '';
  input.style.height = 'auto';
  setState('thinking');
  showThinking(true);
  try {
    await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain; charset=utf-8' },
      body: text
    });
  } catch (_) {
    setState('idle');
    showThinking(false);
  }
}

/* ---------------------------------------------------------------------
 * Entrada
 * ------------------------------------------------------------------- */
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 180) + 'px';
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send(input.value);
  }
});

sendBtn.addEventListener('click', () => send(input.value));
attachBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async () => {
  const f = fileInput.files[0];
  if (!f) return;
  const text = await f.text();
  send('Archivo: ' + f.name + '\n\n' + text);
  fileInput.value = '';
});

connect();
requestAnimationFrame(frame);
</script>

</body>
</html>
